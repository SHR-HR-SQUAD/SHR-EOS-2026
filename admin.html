<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mut:#667085;--ac:#3b5bdb;--bd:#dfe3ea;--err:#c92a2a;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eceef2;--mut:#98a2b3;--ac:#748ffc;--bd:#2a2f38;--err:#ff8787;--ok:#69db7c}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#eceef2;--mut:#98a2b3;--ac:#748ffc;--bd:#2a2f38;--err:#ff8787;--ok:#69db7c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.lock{font-size:40px}h1{font-size:22px;margin:8px 0 6px}p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 20px}
input{width:100%;padding:14px;font-size:20px;letter-spacing:.2em;text-align:center;text-transform:uppercase;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.msg{min-height:20px;margin-top:14px;font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}
.sec{display:none}.adm{text-align:left}.adm code{display:block;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;font-size:12px;margin:6px 0 12px}

body{place-items:start center}.card{max-width:900px;text-align:left}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row label{width:60px;font-weight:600}
.row input{flex:1;min-width:200px;font-size:14px;letter-spacing:0;text-transform:none;text-align:left;padding:10px}
button{width:auto;padding:10px 16px;font-size:14px;margin-top:8px}button.s{background:var(--bd);color:var(--tx);padding:4px 10px;margin:0}
.wrap{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.sum div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px}
h2{font-size:16px;margin:22px 0 4px}select{padding:6px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
</style></head><body><div class="card">
<h1>หลังบ้าน (Admin)</h1>
<div id="login"><p>เข้าสู่ระบบด้วย Google ของผู้ดูแล</p><button id="in">Sign in with Google</button></div>
<div id="app" style="display:none">
<div class="msg" id="msg"></div>
<h2>1) ลิงก์ปลายทางของแต่ละชุด</h2>
<div id="links"></div><button id="save">บันทึกลิงก์ (อัปเดตทุกรหัสในชุดนั้น)</button>
<h2>2) นำเข้ารหัสจากไฟล์ CSV</h2>
<div class="row"><input type="file" id="file" accept=".csv"><button id="imp">นำเข้า</button></div>
<h2>3) สถานะการใช้งาน</h2>
<div class="sum" id="sum"></div>
<h2>ตรวจการส่งต่อลิงก์ (กรอกจำนวนคำตอบจาก SurveyMonkey)</h2>
<div id="sv"></div><button id="svb">บันทึกและตรวจสอบ</button>
<div class="row"><select id="fs"><option value="">ทุกชุด</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
<select id="fu"><option value="">ทั้งหมด</option><option value="y">ใช้แล้ว</option><option value="n">ยังไม่ใช้</option></select>
<button id="out" class="s">ออกจากระบบ</button></div>
<div class="wrap"><table><thead><tr><th>Staff No.</th><th>ชุด</th><th>รหัส</th><th>สถานะ</th><th>เวลาที่ใช้</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc,updateDoc,writeBatch,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBdYDJgVZLUuZfKGUVtFihcbBbddO5jdQw",
  authDomain: "shr-eos-2026.firebaseapp.com",
  databaseURL: "https://shr-eos-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shr-eos-2026",
  storageBucket: "shr-eos-2026.firebasestorage.app",
  messagingSenderId: "589712256015",
  appId: "1:589712256015:web:54c90208278873b570077a",
  measurementId: "G-9RQ3GE5YFW"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let rows=[],links={},survey={};
const say=(t,c)=>{$("msg").className="msg "+(c||"");$("msg").textContent=t};
$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("login").style.display=u?"none":"block";$("app").style.display=u?"block":"none";if(u)load()});
async function load(){
  try{
    const s=await getDocs(collection(db,"codes"));rows=s.docs.map(d=>({code:d.id,...d.data()}));
    const c=await getDoc(doc(db,"config","links"));links=c.exists()?c.data():{};
    const sv=await getDoc(doc(db,"config","survey"));survey=sv.exists()?sv.data():{};
    drawLinks();render();drawSurvey();say("");
  }catch(e){say("ไม่มีสิทธิ์ผู้ดูแล หรือยังไม่ได้ตั้งค่า Rules ("+e.code+")","err")}
}
function drawLinks(){
  $("links").innerHTML="";
  for(let n=1;n<=4;n++){const r=document.createElement("div");r.className="row";
    const l=document.createElement("label");l.textContent="ชุด "+n;
    const i=document.createElement("input");i.id="u"+n;i.placeholder="https://...";i.value=links["s"+n]||"";
    r.append(l,i);$("links").append(r)}
}
async function batched(items,fn){
  for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(x=>fn(b,x));await b.commit()}
}
$("save").onclick=async()=>{
  try{
    const next={};
    for(let n=1;n<=4;n++){const u=$("u"+n).value.trim();if(u&&!/^https?:\/\//.test(u)){say("ลิงก์ชุด "+n+" ต้องขึ้นต้นด้วย https://","err");return}next["s"+n]=u}
    for(let n=1;n<=4;n++)if(next["s"+n]){
      const q=await getDocs(query(collection(db,"codes"),where("set","==",n)));
      await batched(q.docs,(b,d)=>b.update(d.ref,{url:next["s"+n]}));
    }
    await setDoc(doc(db,"config","links"),next);say("บันทึกลิงก์แล้ว","ok");load();
  }catch(e){say("บันทึกไม่สำเร็จ: "+e.message,"err")}
};
$("imp").onclick=async()=>{
  const f=$("file").files[0];if(!f){say("เลือกไฟล์ CSV ก่อน","err");return}
  const lines=(await f.text()).replace(/^\uFEFF/,"").split(/\r?\n/).slice(1).filter(Boolean);
  const items=lines.map(l=>l.split(",")).map(p=>({staffNo:p[0].trim(),set:parseInt(p[1]),code:p[2].trim().toUpperCase()}));
  const bad=items.find(x=>!(x.set>=1&&x.set<=4)||!links["s"+x.set]||!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(x.code));
  if(bad){say("ข้อมูลผิดหรือยังไม่ได้บันทึกลิงก์ของชุด: "+bad.staffNo,"err");return}
  try{
    await batched(items,(b,x)=>b.set(doc(db,"codes",x.code),{staffNo:x.staffNo,set:x.set,url:links["s"+x.set],used:false,usedAt:null}));
    say("นำเข้า "+items.length+" รหัสแล้ว","ok");load();
  }catch(e){say("นำเข้าไม่สำเร็จ: "+e.message,"err")}
};
function render(){
  const sets=[1,2,3,4].map(n=>{const r=rows.filter(x=>x.set===n);return n+": ใช้แล้ว "+r.filter(x=>x.used).length+"/"+r.length});
  $("sum").innerHTML="";[...sets,"รวม: ใช้แล้ว "+rows.filter(x=>x.used).length+"/"+rows.length].forEach(t=>{const d=document.createElement("div");d.textContent=(/^\d/.test(t)?"ชุด ":"")+t;$("sum").append(d)});
  const fs=$("fs").value,fu=$("fu").value;$("tb").innerHTML="";
  rows.filter(x=>(!fs||x.set==fs)&&(!fu||(fu==="y")===!!x.used)).sort((a,b)=>(a.staffNo||"").localeCompare(b.staffNo||"")).forEach(x=>{
    const tr=document.createElement("tr");
    [x.staffNo,x.set,x.code,x.used?"✅ ใช้แล้ว":"ยังไม่ใช้",x.usedAt?x.usedAt.toDate().toLocaleString("th-TH"):""].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});
    const td=document.createElement("td");
    if(x.used){const b=document.createElement("button");b.className="s";b.textContent="รีเซ็ต";b.onclick=async()=>{if(confirm("รีเซ็ตรหัส "+x.code+" ?")){await updateDoc(doc(db,"codes",x.code),{used:false,usedAt:null});load()}};td.append(b)}
    tr.append(td);$("tb").append(tr)});
}
function drawSurvey(){
  $("sv").innerHTML="";
  for(let n=1;n<=4;n++){
    const used=rows.filter(x=>x.set===n&&x.used).length,r=survey["r"+n];
    const row=document.createElement("div");row.className="row";
    const l=document.createElement("label");l.textContent="ชุด "+n;
    const i=document.createElement("input");i.type="number";i.min="0";i.id="r"+n;i.placeholder="จำนวนคำตอบใน SurveyMonkey";i.value=r??"";
    const s=document.createElement("span");
    if(r===undefined||r===""||r===null){s.textContent="รหัสที่ใช้แล้ว "+used}
    else if(Number(r)>used){s.textContent="⚠️ คำตอบ "+r+" มากกว่ารหัสที่ใช้ "+used+" (เกิน "+(r-used)+") อาจมีการส่งต่อลิงก์";s.style.color="var(--err)"}
    else{s.textContent="✅ ปกติ (คำตอบ "+r+" / รหัสที่ใช้ "+used+")"}
    row.append(l,i,s);$("sv").append(row)}
}
$("svb").onclick=async()=>{
  const d={};for(let n=1;n<=4;n++){const v=$("r"+n).value;if(v!=="")d["r"+n]=Number(v)}
  try{await setDoc(doc(db,"config","survey"),d);survey=d;drawSurvey();say("บันทึกแล้ว","ok")}catch(e){say("บันทึกไม่สำเร็จ: "+e.message,"err")}
};
$("fs").onchange=render;$("fu").onchange=render;
</script></body></html>
