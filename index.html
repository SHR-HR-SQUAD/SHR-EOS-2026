<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Staff Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{--bg:#f3f5fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#4f46e5;--ac2:#7c3aed;--bd:#e2e8f0;--soft:#f1f5f9;--err:#dc2626;--ok:#16a34a;--warn:#d97706;--sh:0 10px 40px rgba(79,70,229,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a2e;--tx:#e5e9f5;--mut:#94a3b8;--ac:#818cf8;--ac2:#a78bfa;--bd:#263050;--soft:#1b2340;--err:#f87171;--ok:#4ade80;--warn:#fbbf24;--sh:0 10px 40px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a2e;--tx:#e5e9f5;--mut:#94a3b8;--ac:#818cf8;--ac2:#a78bfa;--bd:#263050;--soft:#1b2340;--err:#f87171;--ok:#4ade80;--warn:#fbbf24;--sh:0 10px 40px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg) radial-gradient(900px 500px at 10% -10%,rgba(124,58,237,.18),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(79,70,229,.16),transparent 60%) no-repeat}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:28px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:transform .08s,opacity .2s}
button:hover{opacity:.92}button:active{transform:scale(.98)}button:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:var(--soft);color:var(--tx);border:1px solid var(--bd);padding:8px 14px;font-size:14px}
input,select{font:inherit;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--soft);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.msg{min-height:22px;font-size:14px;margin-top:14px}.err{color:var(--err)}.ok{color:var(--ok)}
 
body{display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;text-align:center;padding:40px 32px 28px}
.badge{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 24px rgba(79,70,229,.35)}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:15px;line-height:1.55;margin:0 0 26px}
label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:8px}
#code{width:100%;font-size:24px;letter-spacing:.22em;text-align:center;text-transform:uppercase;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
#go{width:100%;margin-top:14px;font-size:16px;padding:15px}
body.sv{display:block}#survey{max-width:min(1200px,100%);margin:0 auto;padding:24px}#survey h2{margin:0 0 6px;font-size:20px}#survey .sub{margin-bottom:18px}#host{min-height:200px}#host iframe{width:100%!important;max-width:100%!important;height:max(900px,calc(100vh - 160px))!important;border:0}@media(max-width:600px){#survey{padding:14px 8px}}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
</style></head><body>
<main class="card" id="gate">
  <div class="badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
  <h1>Staff Access</h1>
  <p class="sub">Enter your personal one-time access code to open your survey.</p>
  <label for="code">Access code</label>
  <input id="code" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="9">
  <button id="go">Continue</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot">🔒 Each code works once and can’t be reused or shared.</div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBdYDJgVZLUuZfKGUVtFihcbBbddO5jdQw",
  authDomain: "shr-eos-2026.firebaseapp.com",
  projectId: "shr-eos-2026",
  storageBucket: "shr-eos-2026.firebasestorage.app",
  messagingSenderId: "589712256015",
  appId: "1:589712256015:web:54c90208278873b570077a"
};
const db=getFirestore(initializeApp(firebaseConfig)),$=id=>document.getElementById(id);
function showSurvey(html){
  document.body.classList.add("sv");$("gate").hidden=true;$("survey").hidden=false;
  const host=$("host");host.innerHTML=html;
  host.querySelectorAll("script").forEach(old=>{
    const s=document.createElement("script");
    [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
    s.textContent=old.textContent;old.replaceWith(s);
  });
}
try{const k=sessionStorage.getItem("sv");if(k)showSurvey(k)}catch(e){}
const say=(t,c)=>{$("msg").className="msg "+c;$("msg").textContent=t};
$("code").addEventListener("input",e=>{let v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);e.target.value=v.length>4?v.slice(0,4)+"-"+v.slice(4):v});
async function unlock(){
  const v=$("code").value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){say("Please enter your code in the format XXXX-XXXX.","err");return}
  $("go").disabled=true;$("go").textContent="Checking…";say("","");
  try{
    const ref=doc(db,"codes",v);
    const url=await runTransaction(db,async tx=>{
      const s=await tx.get(ref);
      if(!s.exists())throw new Error("invalid");
      if(s.data().used)throw new Error("used");
      tx.update(ref,{used:true,usedAt:serverTimestamp()});
      return s.data().url;
    });
    const p=(url||"").trim();
    if(/^https?:\/\//i.test(p)){
      say("Code accepted. Opening your survey…","ok");$("go").textContent="Redirecting…";
      setTimeout(()=>location.replace(p),800);return;
    }
    try{sessionStorage.setItem("sv",p)}catch(e){}
    showSurvey(p);return;
  }catch(e){
    say(e.message==="invalid"?"That code isn’t valid. Please check it and try again.":e.message==="used"?"This code has already been used.":"Something went wrong. Please try again.","err");
  }
  $("go").disabled=false;$("go").textContent="Continue";
}
$("go").onclick=unlock;$("code").onkeydown=e=>{if(e.key==="Enter")unlock()};
</script>
<section id="survey" class="card" hidden>
  <h2>Staff Survey</h2>
  <p class="sub">Your code has been accepted. Please complete the survey below and keep this page open until you submit.</p>
  <div id="host"></div>
</section>
</body></html>
